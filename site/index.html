<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#883fce">
  <meta name="description" content="Explore Mutual, a 2023 matchmaking prototype where friends make the introduction. A guided tour of the original UI and its explainable matching engine.">
  <meta property="og:title" content="Mutual — friends make the introduction">
  <meta property="og:description" content="A guided tour of the original app: profile cards, compatibility, and a little help from your friends.">
  <meta property="og:image" content="https://somilagg123.github.io/mutual/assets/cards-and-matching.png">
  <meta property="og:type" content="website">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Mutual — friends make the introduction</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="assets/scores.js" defer></script>
  <script src="walkthrough.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#walkthrough">Skip to the walkthrough</a>
  <header class="site-header shell">
    <a class="wordmark" href="./" aria-label="Mutual home"><img src="assets/logo.png" alt="" width="36" height="36">mutual</a>
    <nav aria-label="Main navigation"><a href="#walkthrough">App</a><a href="#matching">Matching</a><a href="https://github.com/SomilAgg123/mutual">GitHub</a></nav>
  </header>
  <main>
    <section class="intro shell" aria-labelledby="page-title">
      <h1 id="page-title">Some connections start with <em>a friend.</em></h1>
    </section>

    <section id="walkthrough" class="tour-section" aria-label="Guided app walkthrough">
      <div class="shell">
        <nav id="tour-steps" class="steps" aria-label="Walkthrough screens">
          <button type="button" data-step="browse" aria-current="step">Profile cards</button>
          <button type="button" data-step="matches">Matches</button>
          <button type="button" data-step="compare">Match details</button>
          <button type="button" data-step="icebreaker">Icebreakers</button>
          <button type="button" data-step="introductions">Introductions</button>
          <button type="button" data-step="profile">Profile</button>
          <button type="button" data-step="responses">Photos & prompts</button>
        </nav>
        <div class="tour-heading" aria-live="polite" aria-atomic="true">
          <h2 id="tour-title">Profile cards</h2>
          <span id="tour-progress" aria-label="Screen 1 of 7">1 / 7</span>
        </div>
          <figure class="device-stage">
            <div class="stage-halo" aria-hidden="true"></div>
            <div class="device"><div class="device-viewport"><iframe id="app-screen" src="preview.html?screen=browse" title="Original Mutual profile card, read-only preview" tabindex="-1"></iframe></div></div>
            <figcaption>Read-only demo</figcaption>
          </figure>
        <div class="tour-controls"><button type="button" id="previous" class="button secondary" disabled>Previous</button><button type="button" id="next" class="button primary">Next</button></div>
        <noscript><p class="noscript">Enable JavaScript for the guided tour and score explorer. You can still <a href="assets/cards-and-matching.png">view the original screen gallery</a> or <a href="https://github.com/SomilAgg123/mutual">read the project on GitHub</a>.</p></noscript>
      </div>
    </section>

    <section id="matching" class="matching-section" aria-labelledby="matching-title">
      <div class="shell matching-layout">
        <div class="matching-intro"><h2 id="matching-title">Compatibility</h2><div class="candidates" aria-label="Compare Alex with a candidate"><button type="button" data-candidate="0" aria-pressed="true">Jordan</button><button type="button" data-candidate="1" aria-pressed="false">Riley</button><button type="button" data-candidate="2" aria-pressed="false">Casey</button></div><a href="https://github.com/SomilAgg123/mutual/blob/main/docs/matching.md" class="text-link">Scoring rules</a></div>
        <div class="score-panel" aria-live="polite" aria-atomic="true">
          <p class="score-pair">Alex <span aria-hidden="true">&</span> <span id="candidate-name">Jordan</span></p>
          <div class="score-values"><div><p>Similarity</p><strong id="similarity-value">89.5<span>%</span></strong><div id="similarity-meter" class="meter similarity" role="meter" aria-label="Similarity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="89.47"><span></span></div></div><div><p>Complementarity</p><strong id="complementarity-value">100.0<span>%</span></strong><div id="complementarity-meter" class="meter complementarity" role="meter" aria-label="Complementarity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span></span></div></div></div>
          <p class="score-caveat">Illustrative scores</p>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer shell"><a class="wordmark" href="./"><img src="assets/logo.png" alt="" width="30" height="30">mutual</a><p>Somil Aggarwal & Nalu Concepcion</p><a href="https://github.com/SomilAgg123/mutual/blob/main/NOTICE.md">Credits</a></footer>
</body>
</html>
